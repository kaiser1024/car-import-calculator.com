<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    
    <link rel="stylesheet" href="./css/defaults.css">
    <link rel="stylesheet" href="./css/fonts.css">
    <link rel="stylesheet" href="./css/spacing.css">
    <link rel="stylesheet" href="./css/colors.css">
    <link rel="stylesheet" href="./css/topbar.css">
    <link rel="stylesheet" href="./css/slideout.css">
    <link rel="stylesheet" href="./css/pagetopic.css">
    <link rel="stylesheet" href="./css/calculator.css">
    <link rel="stylesheet" href="./css/testing.css">

    <title>Car Import Calculator</title>
</head>
<body>
    <div class="background"></div>

    <header class="topbar">
        <div class="container">
            
            <ul>
                <li>
                    <a href="#" class="logo">
                        <div class="container"></div>
                    </a>
                </li>
            </ul>
        
        </div>
    </header>
    
    <main>
        <div class="container">
            
            <div class="left">    
                <section class="page-topic">
                    <div class="container">
                        <h1>H1 HEADER V1</h1>
                    </div>
                </section>
    
                <section class="interactive">
                    <div class="container">
                        
                        <section class="tool-1">
                            <div class="form-wrapper r1c1">
                                <form class="calculator">
                                    <div class="calc-m1-de"></div>
                                    <div class="button"><button type="button">BUTTON</button></div>
                                </form>
                            </div>
                        </section>

                        <section class="tool-2">
                            <div class="form-wrapper r1c2">
                                <form class="calculator">
                                    <div class="calc-m1-at"></div>
                                    <div class="button"><button type="button">BUTTON</button></div>
                                </form>
                            </div>
                        </section>

                        <section class="tool-3">
                            <div class="form-wrapper r1c3">
                                <form class="calculator">
                                    <div class="calc-m1-be"></div>
                                    <div class="button"><button type="button">BUTTON</button></div>
                                </form>
                            </div>
                        </section>
                        
                    </div>
                </section>
            
                <section class="faq">
                    <div class="container">
                    </div>
                </section>
            </div>
            
            <div class="right">
            </div>

        </div>    
    </main>
    
    <footer>
        <div class="container">
        </div>
    </footer>

    <script>
    const formData = {
    "calc-m1-de": {
        "calc-m1-de-make": { active: true, parent: "none", label: "Make of Car" },
        "calc-m1-de-model": { active: true, parent: "calc-m1-de-make", label: "Model of Car" },
        "calc-m1-de-year": { active: true, parent: "none",  label: "Year of Manufacture" },
        "calc-m1-de-firstreg": { active: true, parent: "calc-m1-de-year", label: "Date of First Registration" },
        "calc-m1-de-ot": { active: false, parent: "calc-m1-de-year", label: "Oldtimer Registration" },
        "calc-m1-de-fuel": { active: true, parent: "none", label: "Fuel Type" }
    },

    "calc-m1-at": {
        "calc-m1-at-make": { active: true, parent: "none",  label: "Make of Car" },
        "calc-m1-at-model": { active: true, parent: "calc-m1-at-make", label: "Model of Car" },
        "calc-m1-at-year": { active: true, parent: "none",  label: "Year of Manufacture" },
        "calc-m1-at-firstreg": { active: true, parent: "calc-m1-at-year", label: "Date of First Registration" },
        "calc-m1-at-ot": { active: false, parent: "calc-m1-at-year", label: "Oldtimer Registration" },
        "calc-m1-at-fuel": { active: true, parent: "none", label: "Fuel Type" }
    },

    "calc-m1-be": {
        "calc-m1-be-make": { active: true, parent: "none",  label: "Make of Car",  label: "Make of Car" },
        "calc-m1-be-model": { active: true, parent: "calc-m1-be-make", label: "Model of Car" },
        "calc-m1-be-year": { active: true, parent: "none",  label: "Year of Manufacture" },
        "calc-m1-be-firstreg": { active: true, parent: "calc-m1-be-year", label: "Date of First Registration" },
        "calc-m1-be-ot": { active: false, parent: "calc-m1-be-year", label: "Oldtimer Registration" },
        "calc-m1-be-fuel": { active: true, parent: "none", label: "Fuel Type" }
    }
};
